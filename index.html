<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- INTRO -->

<div id="intro">

<div class="intro-overlay"></div>

<h1 class="cinemaTitle">
Happy Girlfriend's Day
</h1>

<p class="cinemaSub">
A little movie made with love...
</p>

<div class="loadingBar">

<div class="loadingProgress"></div>

</div>

</div>

<!-- FLOATING EFFECTS -->

<div id="effects">

<div id="hearts"></div>

<div id="stars"></div>

<div id="sparkles"></div>

<div id="butterflies"></div>

</div>

<!-- MAIN -->

<div id="mainContent">

<!-- HERO -->

<section class="hero">

<div class="glass heroBox">

<h1>

Happy

<span>Girlfriend's Day</span>

❤️

</h1>

<p>

Every heartbeat,

every smile,

every dream...

is brighter because of you.

</p>

<button id="openEnvelope">

Open My Heart

💌

</button>

</div>

</section>

<!-- ENVELOPE -->

<section id="letterSection">

<div class="envelope">

<div class="cover"></div>

<div class="letter">

<h2>For Jasleen ❤️</h2>

<p id="typingText"></p>

</div>

</div>

</section>

<!-- GALLERY -->

<section class="gallerySection">

<h2>Our Beautiful Moments</h2>

<div class="gallery">

<img src="Photo01.png">

<img src="Photo02.png">

<img src="Photo03.png">

<img src="Photo04.png">

<img src="Photo05.png">

<img src="Photo06.png">

<img src="Photo07.png">

<img src="Photo08.png">

</div>

</section>

<!-- LOVE TIMER -->

<section class="timerSection">

<div class="glass timerBox">

<h2>

Together Since ❤️

</h2>

<div id="loveTimer">

0 Days

</div>

</div>

</section>

<!-- END -->

<section class="ending">

<h1>

I Love You Forever

❤️

</h1>

<p>

Thank you for making my world magical.

</p>

<button id="celebrate">

Celebrate Love 🎉

</button>

</section>

</div>

<canvas id="fireworks"></canvas>

<script src="script.js"></script>

</body>

</html>
